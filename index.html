<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simple Sheet Grid</title>

<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f5f5f5;
  }

  header {
    background: #0f9d58;
    color: white;
    padding: 10px 15px;
    font-size: 18px;
  }

  .wrap {
    padding: 10px;
    overflow: auto;
  }

  table {
    border-collapse: collapse;
    background: white;
  }

  th, td {
    border: 1px solid #ddd;
    width: 80px;
    height: 28px;
    text-align: center;
    font-size: 12px;
  }

  th {
    background: #eee;
    font-weight: bold;
    position: sticky;
    top: 0;
  }

  .row-header {
    background: #eee;
    position: sticky;
    left: 0;
  }

  td[contenteditable="true"] {
    outline: none;
  }

  td[contenteditable="true"]:focus {
    background: #e8f0fe;
  }
</style>
</head>

<body>

<header>
  Simple Spreadsheet (A–Z × 1–26)
</header>

<div class="wrap">
  <table id="sheet"></table>
</div>

<script>
  const table = document.getElementById("sheet");

  const cols = 26; // A-Z
  const rows = 26; // 1-26

  function colName(n) {
    return String.fromCharCode(65 + n); // A=65
  }

  // Header row
  let header = "<tr><th></th>";
  for (let c = 0; c < cols; c++) {
    header += `<th>${colName(c)}</th>`;
  }
  header += "</tr>";
  table.innerHTML += header;

  // Data rows
  for (let r = 1; r <= rows; r++) {
    let row = `<tr><th class="row-header">${r}</th>`;
    for (let c = 0; c < cols; c++) {
      row += `<td contenteditable="true"></td>`;
    }
    row += "</tr>";
    table.innerHTML += row;
  }
</script>

</body>
</html>
