<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Speech Table System</title>
  <style>
    *{box-sizing:border-box;}
    body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f1f3f4;color:#202124;overflow:hidden;}
    header{height:56px;background:#fff;border-bottom:1px solid #dadce0;display:flex;align-items:center;gap:10px;padding:0 14px;position:sticky;top:0;z-index:1000;}
    button{border:none;background:#1a73e8;color:white;padding:8px 14px;border-radius:4px;font-size:13px;font-weight:500;cursor:pointer;transition:0.15s;}
    button:hover{background:#1765cc;}
    #toolbar{display:none;background:#fff;border-bottom:1px solid #dadce0;padding:10px 14px;gap:16px;flex-wrap:wrap;align-items:center;}
    #uploadBox{display:none;background:#fff;border-bottom:1px solid #dadce0;padding:14px;}
    label{font-size:13px;color:#5f6368;display:flex;align-items:center;gap:6px;}
    input,textarea,select{border:1px solid #dadce0;border-radius:4px;padding:6px 8px;font-size:13px;outline:none;}
    input:focus,textarea:focus,select:focus{border-color:#1a73e8;}
    textarea{width:320px;height:90px;resize:vertical;display:block;margin-bottom:10px;}
    #sheetWrap{overflow:auto;height:calc(100vh - 56px);background:#fff;}
    table{border-collapse:collapse;table-layout:fixed;background:white;}
    th{border:1px solid #e0e0e0;background:#f8f9fa;color:#5f6368;font-weight:500;text-align:center;height:32px;min-width:100px;width:100px;font-size:12px;position:sticky;top:0;z-index:20;}
    .row-head{min-width:50px;width:50px;left:0;z-index:30;position:sticky;background:#f8f9fa;}
    td{border:1px solid #e0e0e0;width:100px;height:32px;padding:4px 8px;font-size:13px;text-align:left;vertical-align:middle;background:white;position:relative;}
    td:hover{background:#f8fbff;}
    td:focus{outline:none;border:2px solid #1a73e8;z-index:50;}
    .col-select{width:90%;border:none;background:transparent;font-size:11px;color:#5f6368;}
    .reading{background:#fff59d !important;}
    ::-webkit-scrollbar{width:10px;height:10px;}
    ::-webkit-scrollbar-track{background:#f1f1f1;}
    ::-webkit-scrollbar-thumb{background:#c1c1c1;border-radius:20px;}
    ::-webkit-scrollbar-thumb:hover{background:#a8a8a8;}
  </style>
</head>
<body>

<header>
  <button onclick="saveTable()">Save Table Data</button>
<button onclick="uploadTable()">Upload Table</button>
  
  <button onclick="toggleUpload()">Upload Column</button>
  <button onclick="toggleReader()">Reader Options</button>
  <button onclick="startReading()">Start Reading</button>
  <button onclick="stopReading()">Stop</button>
  <button id="openFinder">Frequency Finder</button>
</header>

<div id="uploadBox">
  <h3>Upload Column</h3>

  <textarea id="columnData" placeholder="Paste column data here"></textarea>

  <select id="columnSelect">
    <option value="0">Column A</option>
    <option value="1">Column B</option>
    <option value="2">Column C</option>
    <option value="3">Column D</option>
    <option value="4">Column E</option>
    <option value="5">Column F</option>
    <option value="6">Column G</option>
    <option value="7">Column H</option>
    <option value="8">Column I</option>
    <option value="9">Column J</option>
    <option value="10">Column K</option>
    <option value="11">Column L</option>
    <option value="12">Column M</option>
    <option value="13">Column N</option>
    <option value="14">Column O</option>
    <option value="15">Column P</option>
    <option value="16">Column Q</option>
    <option value="17">Column R</option>
    <option value="18">Column S</option>
    <option value="19">Column T</option>
    <option value="20">Column U</option>
    <option value="21">Column V</option>
    <option value="22">Column W</option>
    <option value="23">Column X</option>
    <option value="24">Column Y</option>
    <option value="25">Column Z</option>
  </select>

  <button onclick="uploadColumn()">Upload</button>
</div>

<div id="toolbar">
  <label>Speed <input id="speed" type="range" min="0.5" max="2" step="0.1" value="1"></label>
  <label>Repeat Row <input id="repeatRow" type="number" min="1" value="1"></label>
  <label>Repeat Table Loop <input id="repeatTable" type="number" min="1" value="1"></label>
  <label>Repeat Cell <input id="repeatCell" type="number" min="1" value="1"></label>
  <label>Start Cell <input id="startCell" type="text" placeholder="A1"></label>
  <label>End Cell <input id="endCell" type="text" placeholder="Z26"></label>
  <label>Reverse Order <input id="reverse" type="checkbox"></label>
</div>

<div id="sheetWrap">
  <table id="sheet"></table>
</div>

<div id="sheetWrap">
  <table id="sheet"></table>
</div>

<script>
  // --- CONFIGURATION ---
  const TOTAL_COLS = 26;
  let totalRows = 26; // STARTS EXACTLY AT 26
  
  const sheetTable = document.getElementById("sheet");
  const colSelectMap = { 0:'A', 1:'B', 2:'C', 3:'D', 4:'E', 5:'F', 6:'G', 7:'H', 8:'I', 9:'J', 10:'K', 11:'L', 12:'M', 13:'N', 14:'O', 15:'P', 16:'Q', 17:'R', 18:'S', 19:'T', 20:'U', 21:'V', 22:'W', 23:'X', 24:'Y', 25:'Z' };

  // --- 1. INITIAL RENDER (Fast & Static) ---
  // Generate Header (Letters A-Z)
  let headerRow = "<tr><th></th>";
  for(let c=0; c<TOTAL_COLS; c++) headerRow += `<th>${colSelectMap[c]}</th>`;
  headerRow += "</tr>";

  // Generate Selector Row (Languages)
  let selRow = "<tr><th></th>";
  for(let c=0; c<TOTAL_COLS; c++) {
    selRow += `<th><select class='col-select'><option>Off</option><option>EN</option><option>IT</option><option>ES</option><option>FR</option><option>DE</option></select></th>`;
  }
  selRow += "</tr>";

  // Cache the static cells HTML for reuse
  const staticCells = Array(TOTAL_COLS).fill('<td contenteditable="true"></td>').join("");

  // Build Body (Exactly 26 Rows)
  let bodyHtml = "";
  for(let r=1; r<=totalRows; r++){
    bodyHtml += `<tr><th class="row-head">${r}</th>${staticCells}</tr>`;
  }

  sheetTable.innerHTML = headerRow + selRow + bodyHtml;


  // --- 2. SMART EXPANSION LOGIC ---
  
  // Function to add N new rows at the bottom quickly
  function addNewRows(count) {
    if(count <= 0) return;
    let htmlBuffer = "";
    for(let i=0; i<count; i++){
      totalRows++;
      htmlBuffer += `<tr><th class="row-head">${totalRows}</th>${staticCells}</tr>`;
    }
    sheetTable.insertAdjacentHTML('beforeend', htmlBuffer);
  }

  // --- 3. TAB NAVIGATION HANDLER ---
  sheetTable.addEventListener('keydown', (e) => {
    const target = e.target;
    
    // ONLY INTERCEPT IF INSIDE A DATA CELL (<td>)
    if(target.tagName.toLowerCase() !== 'td') return;

    if(e.key === 'Tab') {
      e.preventDefault(); // Stop default focus jump
      
      // Get current cell info
      const tdIndex = Array.from(target.parentElement.children).indexOf(target);
      const rowIndex = Array.from(sheetTable.querySelectorAll('tr')).indexOf(target.parentElement);

      // Determine Next Cell
      let nextTd;
      
      // Is it the last column (Z)?
      if(tdIndex === TOTAL_COLS) { 
        // Check if it is the very last row of the whole table
        if(rowIndex === sheetTable.rows.length - 1) {
          // EXPAND: Create new row
          addNewRows(1);
          // Move focus to first cell of new row
          const newRow = sheetTable.rows[sheetTable.rows.length - 1];
          nextTd = newRow.cells[1]; // Index 0 is row number, 1 is Column A
        } else {
          // Move to first cell of NEXT row
          const nextRow = sheetTable.rows[rowIndex + 1];
          nextTd = nextRow.cells[1];
        }
      } else {
        // Same row, next column
        nextTd = target.nextElementSibling;
      }

      if(nextTd && nextTd.tagName.toLowerCase() === 'td') {
        nextTd.focus();
        // Place cursor at end of content
        placeCaretAtEnd(nextTd);
      }
    }
  });

  // Helper for caret position
  function placeCaretAtEnd(el) {
    el.focus();
    var range = document.createRange();
    range.selectNodeContents(el);
    range.collapse(false);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }


  // --- 4. COLUMN UPLOAD LOGIC ---
  window.uploadColumn = function() {
    const rawText = document.getElementById("columnData").value;
    const colIndexInput = parseInt(document.getElementById("columnSelect").value);
    
    if(!rawText.trim()) return alert("Please paste some text.");

    const lines = rawText.split(/\r?\n/);
    
    // Check if we need more rows
    const currentDataRows = sheetTable.rows.length - 2; // Minus header rows
    if(lines.length > currentDataRows) {
      const missingRows = lines.length - currentDataRows;
      console.log(`Auto-expanding ${missingRows} rows...`);
      addNewRows(missingRows);
    }

    // Clear target column first? Optional. Let's fill.
    const allRows = sheetTable.rows;
    
    // Fill Data (Start at index 2 because 0 is letters, 1 is language selectors)
    for(let i = 0; i < lines.length; i++) {
      if(allRows[i+2]) { // Check if row exists
        const td = allRows[i+2].cells[colIndexInput + 1]; // +1 because index 0 is row number
        if(td) td.innerText = lines[i];
      }
    }

    // Hide UI feedback
    document.getElementById("uploadBox").style.display = "none";
  };

  // Helper functions for buttons (Toggle visibility)
  window.toggleUpload = () => {
    const box = document.getElementById("uploadBox");
    box.style.display = box.style.display === "none" || box.style.display === "" ? "block" : "none";
  };
</script>



<script src="script.js"></script>
</body>
</html>
