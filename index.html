<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speech Table System</title>

<style>


  .active-cell {
  background: #ffeb3b !important;
  color: black;
  outline: 3px solid #ff9800;
  box-shadow:
    0 0 12px #ff9800,
    0 0 24px rgba(255,152,0,0.7);

  transition: all 0.2s ease;
}


  
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f5f5f5;
  }

  header {
    background: #1a73e8;
    color: white;
    padding: 10px;
    display: flex;
    gap: 10px;
    align-items: center;
  }

  button {
    padding: 6px 10px;
    cursor: pointer;
  }

  #toolbar {
    display: none;
    background: #eee;
    padding: 10px;
    gap: 10px;
    flex-wrap: wrap;
  }

  #uploadBox {
    display: none;
    padding: 10px;
    background: #ddd;
  }

  #sheetWrap {
    overflow: auto;
    padding: 10px;
  }

  table {
    border-collapse: collapse;
    background: white;
  }

  th, td {
    border: 1px solid #ccc;
    width: 90px;
    height: 30px;
    text-align: center;
    font-size: 12px;
  }

  th {
    background: #f0f0f0;
    position: sticky;
    top: 0;
  }

  .row-head {
    background: #f0f0f0;
    position: sticky;
    left: 0;
  }

  td[contenteditable="true"] {
    outline: none;
    overflow-wrap: anywhere;
  }

  /* column selector row under letters */
  .col-select {
    width: 90px;
    font-size: 10px;
  }



  #toolbar {
  display: none;
  background: #eee;
  padding: 10px;
  gap: 16px;
  flex-wrap: wrap;
  align-items: center;
}

#toolbar label {
  display: flex;
  flex-direction: column;
  font-size: 12px;
  gap: 4px;
}

.reading {
  background: #ffe082 !important;
  transition: background 0.2s;
}

button {
  border: none;
  background: white;
  border-radius: 6px;
  font-weight: bold;
}

button:hover {
  background: #ddd;
}


  
</style>
</head>

<body>

<!-- TOP BUTTON BAR -->
<!-- TOP BUTTON BAR -->
<header>
  <button onclick="saveTable()">💾 Save</button>
  <button onclick="loadTable()">📂 Load</button>

  <button onclick="toggleUpload()">Upload Column</button>

  <button onclick="toggleReader()">Reader Options</button>

  <!-- NEW -->
  <button id="startBtn" onclick="readTable()">▶ Start Reading</button>

  <button id="stopBtn" onclick="stopReading()">■ Stop</button>
</header>

<!-- READER TOOLBAR -->
<div id="toolbar">

  <label>
    Speed
    <input id="speedInput" type="range"
           min="0.5"
           max="2"
           step="0.1"
           value="1">
  </label>

  <label>
    Repeat Row
    <input id="repeatRowInput"
           type="number"
           min="1"
           value="1">
  </label>

  <label>
    Repeat Table Loop
    <input id="repeatTableInput"
           type="number"
           min="1"
           value="1">
  </label>

  <label>
    Repeat Cell
    <input id="repeatCellInput"
           type="number"
           min="1"
           value="1">
  </label>

  <label>
    Start Cell
    <input id="startCellInput"
           type="text"
           value="A1">
  </label>

  <label>
    End Cell
    <input id="endCellInput"
           type="text"
           value="Z26">
  </label>

  <label>
    Reverse
    <input id="reverseInput"
           type="checkbox">
  </label>

</div>
<!-- UPLOAD BOX -->
<div id="uploadBox">
  <h3>Upload Column</h3>

  <textarea placeholder="Paste column data here"></textarea>

  <select>
    <option>Column A</option>
    <option>Column B</option>
    <option>Column C</option>
    <option>Column D</option>
  </select>

  <button>Upload</button>
</div>

<!-- READER TOOLBAR -->
<div id="toolbar">
  <label>Speed <input type="range"></label>

  <label>Repeat Row
    <input type="number" min="1">
  </label>

  <label>Repeat Table Loop
    <input type="number" min="1">
  </label>

  <label>Repeat Cell
    <input type="number" min="1">
  </label>

  <label>Start Cell
    <input type="text" placeholder="A1">
  </label>

  <label>End Cell
    <input type="text" placeholder="Z26">
  </label>

  <label>
    Reverse Order
    <input type="checkbox">
  </label>
</div>

<!-- TABLE -->
<div id="sheetWrap">
  <table id="sheet"></table>
</div>

<script>
const cols = 26;
const rows = 26;

const table = document.getElementById("sheet");

// column letters
function colName(n) {
  return String.fromCharCode(65 + n);
}

// HEADER ROW
let header = "<tr><th></th>";
for (let c = 0; c < cols; c++) {
  header += `<th>${colName(c)}</th>`;
}
header += "</tr>";

// COLUMN SELECTOR ROW (under letters)
let selector = "<tr><th></th>";
for (let c = 0; c < cols; c++) {
  selector += `<th><select class='col-select'>
    <option>Off</option>
    <option>EN</option>
    <option>IT</option>
    <option>ES</option>
    <option>FR</option>
    <option>DE</option>
  </select></th>`;
}
selector += "</tr>";

table.innerHTML += header + selector;

// DATA ROWS
for (let r = 1; r <= rows; r++) {
  let row = `<tr><th class="row-head">${r}</th>`;
  for (let c = 0; c < cols; c++) {
    row += `<td contenteditable="true"></td>`;
  }
  row += "</tr>";
  table.innerHTML += row;
}

// UI toggles (structure only)
function toggleUpload() {
  const box = document.getElementById("uploadBox");
  box.style.display = box.style.display === "block" ? "none" : "block";
}

function toggleReader() {
  const bar = document.getElementById("toolbar");
  bar.style.display = bar.style.display === "flex" ? "none" : "flex";
}
</script>

  <script src="script.js"></script>

</body>
</html>
