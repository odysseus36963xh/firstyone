<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Sheets Clone</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
    }

    header {
      background: #0f9d58;
      color: white;
      padding: 10px 15px;
      font-size: 18px;
    }

    .sheet {
      margin: 20px;
      border-collapse: collapse;
      background: white;
    }

    .sheet td, .sheet th {
      border: 1px solid #ddd;
      width: 100px;
      height: 30px;
      text-align: center;
    }

    .sheet th {
      background: #eee;
      font-weight: bold;
    }

    td[contenteditable="true"] {
      background: #fff;
      outline: none;
    }

    td[contenteditable="true"]:focus {
      background: #e8f0fe;
    }
  </style>
</head>

<body>

<header>
  My Simple Sheets Clone
</header>

<table class="sheet">
  <tr>
    <th></th>
    <th>A</th>
    <th>B</th>
    <th>C</th>
    <th>D</th>
  </tr>

  <tr>
    <th>1</th>
    <td contenteditable="true"></td>
    <td contenteditable="true"></td>
    <td contenteditable="true"></td>
    <td contenteditable="true"></td>
  </tr>

  <tr>
    <th>2</th>
    <td contenteditable="true"></td>
    <td contenteditable="true"></td>
    <td contenteditable="true"></td>
    <td contenteditable="true"></td>
  </tr>

  <tr>
    <th>3</th>
    <td contenteditable="true"></td>
    <td contenteditable="true"></td>
    <td contenteditable="true"></td>
    <td contenteditable="true"></td>
  </tr>

  <tr>
    <th>4</th>
    <td contenteditable="true"></td>
    <td contenteditable="true"></td>
    <td contenteditable="true"></td>
    <td contenteditable="true"></td>
  </tr>
</table>

</body>
</html>
